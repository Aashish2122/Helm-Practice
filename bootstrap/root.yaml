apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Aashish2122/Helm-Practice
    targetRevision: main
    path: apps # a FOLDER of Application YAMLs

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd # Applications live in the argocd namespace

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
