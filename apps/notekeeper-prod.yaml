apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notekeeper-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Aashish2122/Helm-Practice
    targetRevision: main
    path: charts/notekeeper
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: nk-prod
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
