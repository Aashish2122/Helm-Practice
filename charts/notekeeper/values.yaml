# Number of API replicas.
replicaCount: 2

image:
  repository: nginx
  # ALWAYS quote tags. Unquoted 1.10 is parsed as a float and becomes 1.1.
  tag: "1.27-alpine"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  # Port the Service listens on.
  port: 80
  # Port the container listens on.
  targetPort: 80
# Passed through verbatim to the container.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
# Non-sensitive config, injected as env vars.
config:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: notekeeper
  LOG_LEVEL: info
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
# Database migration Job, run as a pre-install/pre-upgrade hook.
migration:
  enabled: false
  command:
    - /bin/sh
    - -c
    - |
      echo "==> Starting migration"
      sleep 5
      echo "==> Migration complete"
