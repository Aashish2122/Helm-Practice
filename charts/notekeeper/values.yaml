# Number of API replicas.
replicaCount: 2

image:
  repository: ghcr.io/aashish2122/github-actions
  # ALWAYS quote tags. Unquoted 1.10 is parsed as a float and becomes 1.1.
  tag: "latest"
  pullPolicy: Always

service:
  type: ClusterIP
  # Port the Service listens on.
  port: 80
  # Port the container listens on.
  targetPort: 8080
# Passed through verbatim to the container.
resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: 1500m
    memory: 768Mi
# Non-sensitive config, injected as env vars.
config:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: notekeeper
  LOG_LEVEL: info
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
# Database migration Job, run as a pre-install/pre-upgrade hook.
migration:
  enabled: false
  command:
    - /bin/sh
    - -c
    - |
      echo "==> Starting migration"
      sleep 5
      echo "==> Migration complete"
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 0
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  failureThreshold: 30
  periodSeconds: 5
